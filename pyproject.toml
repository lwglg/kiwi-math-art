[project]
name = "kiwi-math-art"
version = "0.1.0"
description = "Kiwi drawn with closed-form formulas (after Hamid Naderi Yeganeh): Python renderer and Typst documentation."
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Guilherme Lima Gonçalves" }]
dependencies = [
    "numpy>=2.3",
    "pillow>=11.3",
]

[project.scripts]
kiwi = "kiwi.cli:main"
kiwi-docs = "kiwi.docs_build:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "mypy>=1.17",
    "typst>=0.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiwi"]
